name: Build StudyArtist Debug APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Extract StudyArtist project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q "StudyArtist_v2.1_FINAL.zip" -d extracted

          echo "Checking extracted project..."
          test -f "extracted/StudyArtist_Android_Project/settings.gradle"
          test -f "extracted/StudyArtist_Android_Project/app/build.gradle"

      - name: Build signed Debug APK
        env:
          VERSION_CODE: ${{ 1000 + github.run_number }}
          VERSION_NAME: 2.1.${{ github.run_number }}
        working-directory: extracted/StudyArtist_Android_Project
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f "extracted/StudyArtist_Android_Project/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "extracted/StudyArtist_Android_Project/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyArtist-debug-apk-v2.1-${{ github.run_number }}
          path: extracted/StudyArtist_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
